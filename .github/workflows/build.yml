name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - run: gradle build --no-daemon
      - name: Check mixin target in mappings
        run: |
          for f in $(find . ~/.gradle -name '*.tiny' 2>/dev/null | head -5); do echo "== $f"; grep -n 'renderHealthBar' "$f" | head -5 || true; done
      - name: Build adventure world
        run: bash tools/build-world.sh
      - name: Package
        run: |
          mkdir -p package/mods package/saves
          cp build/libs/shinobi-1.0.0.jar package/mods/
          cp server/mods/fabric-api.jar "package/mods/fabric-api-0.92.2+1.20.1.jar"
          cp -r "server/Shinobi Adventure" "package/saves/Shinobi Adventure"
          cp tools/README-INSTALL.txt package/README.txt
          git archive --format=zip -o package/shinobi-source.zip HEAD
          (cd package && zip -qr ../Shinobi-Complete.zip .)
          (cd server && zip -qr "../Shinobi-Adventure-World.zip" "Shinobi Adventure")
          ls -la Shinobi-Complete.zip Shinobi-Adventure-World.zip
          tail -30 server/server.log
      - uses: actions/upload-artifact@v4
        with:
          name: shinobi-complete
          path: Shinobi-Complete.zip
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Shinobi-Complete.zip build/libs/shinobi-1.0.0.jar Shinobi-Adventure-World.zip --title "Shinobi mod (latest build)" --notes "Shinobi-Complete.zip — всё в одном: мод, Fabric API, готовая карта, исходники и инструкция (README.txt внутри)."
