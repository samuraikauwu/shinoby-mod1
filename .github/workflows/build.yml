name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: shinobi-mod
          path: build/libs/shinobi-1.0.0.jar
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/shinobi-1.0.0.jar --title "Shinobi mod (latest build)" --notes "Готовый мод. Положите shinobi-1.0.0.jar в папку mods (Fabric 1.20.1 + Fabric API)."
